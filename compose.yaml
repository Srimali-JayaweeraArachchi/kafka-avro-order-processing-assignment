name: order-avro-kafka-assignment

x-app-env: &app-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  ORDER_TOPIC: orders
  DLQ_TOPIC: orders.dlq
  CONSUMER_GROUP: order-average-consumer
  MAX_RETRIES: 3
  RETRY_BACKOFF_SECONDS: 1

services:
  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  topic-init:
    image: apache/kafka:4.1.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.dlq --partitions 1 --replication-factor 1

  producer:
    build: .
    command: ["python", "-m", "order_app.producer"]
    environment:
      <<: *app-env
      MESSAGE_INTERVAL_SECONDS: 1
      DEMO_FAILURE_MESSAGES: "true"
    depends_on:
      topic-init:
        condition: service_completed_successfully
    restart: unless-stopped

  consumer:
    build: .
    command: ["python", "-m", "order_app.consumer"]
    environment:
      <<: *app-env
      FAIL_TEMPORARY_PRODUCTS: RetryItem
      FAIL_PERMANENT_PRODUCTS: BrokenItem
    depends_on:
      topic-init:
        condition: service_completed_successfully
    restart: unless-stopped

  dlq-inspector:
    build: .
    command: ["python", "-m", "order_app.dlq_inspector"]
    environment:
      <<: *app-env
    depends_on:
      topic-init:
        condition: service_completed_successfully
    profiles:
      - tools

volumes:
  kafka_data:
